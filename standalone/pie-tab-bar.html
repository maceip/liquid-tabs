				if ([
					"full",
					"reduced",
					"off"
				].includes(saved.motion)) checked.motion = saved.motion;
				applyEffects(checked, false);
			}
		} catch {}
		document.querySelector("#all-tabs").addEventListener("click", () => {
			const existing = document.querySelector(".tab-overview");
			if (existing) {
				existing.remove();
				return;
			}
			const overlay = document.createElement("div");
			overlay.className = "tab-overview";
			overlay.role = "dialog";
			overlay.setAttribute("aria-label", "Open tabs");
			const heading = document.createElement("div");
			heading.className = "overview-heading";
			heading.innerHTML = "<h2>Open tabs</h2><button type=\"button\" aria-label=\"Close tab list\">×</button>";
			heading.querySelector("button").onclick = () => overlay.remove();
			overlay.append(heading);
			for (const tab of strip.items) {
				const button = document.createElement("button");
				button.type = "button";
				button.className = "overview-tab";
				button.innerHTML = `<span>${iconMarkup(tab.icon)}</span><strong></strong><small></small>`;
				button.querySelector("strong").textContent = tab.title;
				button.querySelector("small").textContent = tab.pinned ? "Pinned" : tab.address;
				button.onclick = () => {
					strip.select(tab.id);
					overlay.remove();
				};
				overlay.append(button);
			}
			overlay.addEventListener("keydown", (e) => {
				if (e.key === "Escape") overlay.remove();
			});
			document.querySelector(".browser").append(overlay);
			heading.querySelector("button").focus();
		});
		Object.assign(window, { tabDemo: {
			strip,
			scene
		} });
		if (boot) applyEffects(boot.effects, false);
		strip.setTheme(theme);
		document.querySelector(".browser").dataset.theme = theme;
		document.querySelectorAll("[data-theme-button]").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.themeButton === theme)));
		saveWorkspace();
		incoming?.accept();
	}
	start();
	//#endregion
})();

(() => {
  const root = document.getElementById('pie-tab-bar-inline');
  const { strip, scene } = window.tabDemo;
  let restoring = false;
  let lastState = '';
  function restore(snapshot) {
    const state = snapshot?.privateContent;
    if (!state) return;
    const serialized = JSON.stringify(state);
    if (serialized === lastState) return;
    lastState = serialized;
    restoring = true;
    if (['one', 'two', 'pinned', 'many'].includes(state.scene)) scene(state.scene);
    if (['light', 'dark'].includes(state.theme)) root.querySelector(`[data-theme-button="${state.theme}"]`).click();
    if (['fixed', 'address'].includes(state.labelMode)) {
      const labels = root.querySelector('#label-mode');
      labels.value = state.labelMode;
      labels.dispatchEvent(new Event('change', { bubbles: true }));
    }
    if (state.effects) {
      for (const input of root.querySelectorAll('[data-effect]')) {
        const value = state.effects[input.dataset.effect];
        if (typeof value === 'boolean' && input.checked !== value) input.click();
      }
      if (['full', 'reduced', 'off'].includes(state.effects.motion)) {
        const motion = root.querySelector('#motion');
        motion.value = state.effects.motion;
        motion.dispatchEvent(new Event('change', { bubbles: true }));
      }
    }
    restoring = false;
  }
  const appearance = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  root.querySelector(`[data-theme-button="${appearance}"]`).click();
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals', event => restore(event.detail?.globals?.widgetState));
  function save() {
    if (restoring || !window.openai?.setWidgetState) return;
    const state = {
      scene: root.querySelector('[data-scene][aria-pressed="true"]')?.dataset.scene || 'two',
      theme: root.querySelector('.browser').dataset.theme,
      labelMode: root.querySelector('#label-mode').value,
      effects: strip.configuration,
    };
    lastState = JSON.stringify(state);
    window.openai.setWidgetState({ modelContent: { preview: 'Pie tab bar', ...state }, privateContent: state }).catch(() => {});
  }
  root.addEventListener('click', save);
  root.addEventListener('change', save);
})();
</script>
